name: Update Primary Stack

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch language stats and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error

          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          repos = github_json(
              f"https://api.github.com/users/{user}/repos"
              "?per_page=100&type=owner&sort=updated"
          )

          totals = {}

          for repo in repos:
              if repo.get("fork") or repo.get("archived"):
                  continue

              lang_url = repo.get("languages_url")
              if not lang_url:
                  continue

              try:
                  langs = github_json(lang_url)
              except urllib.error.HTTPError as error:
                  print(f"Skipping {repo.get('name')}: HTTP {error.code}")
                  continue

              for lang, byte_count in langs.items():
                  totals[lang] = totals.get(lang, 0) + byte_count

          if totals:
              total_bytes = sum(totals.values())
              top_langs = sorted(
                  totals.items(),
                  key=lambda item: item[1],
                  reverse=True,
              )[:5]

              formatted = " · ".join(
                  f"**{lang}** ({(byte_count / total_bytes) * 100:.1f}%)"
                  for lang, byte_count in top_langs
              )
          else:
              formatted = ""

          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as file:
              content = file.read()

          new_block = (
              "<!-- LANG-STATS:START -->\n"
              f"{formatted}\n"
              "<!-- LANG-STATS:END -->"
          )

          pattern = r"<!-- LANG-STATS:START -->.*?<!-- LANG-STATS:END -->"

          if re.search(pattern, content, flags=re.DOTALL):
              updated = re.sub(
                  pattern,
                  new_block,
                  content,
                  count=1,
                  flags=re.DOTALL,
              )
          else:
              updated = content.rstrip() + "\n\n" + new_block + "\n"

          with open(readme_path, "w", encoding="utf-8") as file:
              file.write(updated)
          PY

      - name: Commit and push README changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update primary stack"
          git push
